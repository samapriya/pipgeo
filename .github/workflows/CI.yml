name: CI pipgeo

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install uv build
      
    - name: Build package
      run: |
        python -m build
        
    - name: Install package from dist
      shell: pwsh
      run: |
        $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
        pip install $wheel.FullName
        
    - name: Test package help
      run: |
        pipgeo -h
        pipgeo release
        
    - name: Test package version check
      run: |
        python -c "import pipgeo; print('Import successful')"
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: matrix.python-version == '3.12'
      with:
        name: dist-packages
        path: dist/
        retention-days: 7

  lint:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
      
    - name: Install dependencies
      run: |
        pip install ruff black
        
    - name: Check formatting with black
      run: |
        black --check pipgeo/
        
    - name: Lint with ruff
      run: |
        ruff check pipgeo/
